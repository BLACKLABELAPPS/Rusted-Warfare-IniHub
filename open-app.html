<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f766e">
  <link rel="canonical" href="https://blacklabelapps.github.io/rustedwarfareworkshop/open-app.html">
  <title>Rusted Warfare Workshop</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at top, #173c42, #081015 62%);
      color: #f4f7f8;
    }
    main {
      width: min(540px, 100%);
      padding: 28px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      background: rgba(19,32,38,.94);
      box-shadow: 0 24px 70px rgba(0,0,0,.36);
    }
    .logo {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #14b8a6;
      color: #062b2a;
      font-weight: 900;
      font-size: 24px;
    }
    h1 { margin: 18px 0 8px; font-size: clamp(24px, 6vw, 34px); }
    p { margin: 0; color: #cbd5da; line-height: 1.55; }
    .target {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(0,0,0,.22);
      color: #a7f3d0;
      overflow-wrap: anywhere;
      font-size: 13px;
    }
    .actions { display: grid; gap: 10px; margin-top: 22px; }
    a {
      display: block;
      padding: 13px 16px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: 750;
    }
    #open { background: #14b8a6; color: #062b2a; }
    #external { border: 1px solid rgba(20,184,166,.65); color: #b9fff7; }
    #install { border: 1px solid rgba(255,255,255,.2); color: #f4f7f8; }
    small { display: block; margin-top: 15px; color: #8fa2ab; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <div class="logo">RW</div>
    <h1>Rusted Warfare Workshop</h1>
    <p id="status">Opening the shared Workshop post in the application…</p>
    <div id="target" class="target"></div>
    <div class="actions">
      <a id="open" href="#">Open in the application</a>
      <a id="external" href="#" rel="noopener noreferrer">Open on Steam Workshop</a>
      <a id="install" href="https://blacklabelapps.itch.io/rusted-warfare-workshop" rel="noopener noreferrer">Install the application</a>
    </div>
    <small id="hint">The first button opens this exact post inside Rusted Warfare Workshop. Steam is used only as an external fallback.</small>
  </main>
  <script>
    (() => {
      'use strict';

      const APP_ID = '647960';
      const APP_SCHEME = 'rwworkshop';
      const APP_HOST = 'open';
      const APP_PACKAGE = 'com.BlackLabelAppsSoftware.RustedWarfareWorkShop';
      const INSTALL_URL = 'https://blacklabelapps.itch.io/rusted-warfare-workshop';
      const HOME_URL = `https://steamcommunity.com/workshop/browse/?appid=${APP_ID}&browsesort=mostrecent`;
      const rawHash = location.hash.replace(/^#/, '').trim();
      const params = new URLSearchParams(rawHash.includes('=') ? rawHash : '');

      const safeDecode = (value) => {
        try { return decodeURIComponent(String(value || '')); }
        catch (_) { return String(value || ''); }
      };

      const normalizeSteamUrl = (value) => {
        try {
          const url = new URL(value);
          const host = url.hostname.toLowerCase();
          const allowed = host === 'steamcommunity.com' ||
            host === 'steamcommunity-com.translate.goog' ||
            host.endsWith('.steamcommunity-com.translate.goog');
          if (!allowed || (url.protocol !== 'http:' && url.protocol !== 'https:')) return '';
          url.protocol = 'https:';
          url.hostname = 'steamcommunity.com';
          for (const key of [...url.searchParams.keys()]) {
            if (key.toLowerCase().startsWith('_x_tr_')) url.searchParams.delete(key);
          }
          return url.toString();
        } catch (_) { return ''; }
      };

      let target = '';
      let deepLinkQuery = '';
      const id = (params.get('id') || params.get('workshop') || params.get('steam') || '').trim();
      if (/^\d+$/.test(id)) {
        target = `https://steamcommunity.com/sharedfiles/filedetails/?id=${encodeURIComponent(id)}`;
        deepLinkQuery = `id=${encodeURIComponent(id)}`;
      }

      if (!target) {
        const encodedUrl = params.get('u') || params.get('url') || '';
        const decodedUrl = normalizeSteamUrl(safeDecode(encodedUrl));
        if (decodedUrl) {
          target = decodedUrl;
          deepLinkQuery = `u=${encodeURIComponent(decodedUrl)}`;
        }
      }

      if (!target && /^\d+$/.test(rawHash)) {
        target = `https://steamcommunity.com/sharedfiles/filedetails/?id=${encodeURIComponent(rawHash)}`;
        deepLinkQuery = `id=${encodeURIComponent(rawHash)}`;
      }

      if (!target) {
        const section = (params.get('section') || '').trim().toLowerCase();
        const sectionTags = {
          maps: 'Maps',
          units: 'Units',
          addons: 'Units',
          conversions: 'Total Conversion',
          'total conversion': 'Total Conversion'
        };
        const tag = sectionTags[section] || '';
        target = tag
          ? `https://steamcommunity.com/workshop/browse/?appid=${APP_ID}&requiredtags%5B%5D=${encodeURIComponent(tag)}&browsesort=mostrecent`
          : HOME_URL;
        deepLinkQuery = tag
          ? `section=${encodeURIComponent(section)}`
          : 'section=home';
      }

      const customSchemeUrl = `${APP_SCHEME}://${APP_HOST}?${deepLinkQuery}`;
      const fallbackPage = `${location.origin}${location.pathname}?fallback=1${location.hash}`;
      const androidIntentUrl = `intent://${APP_HOST}?${deepLinkQuery}` +
        `#Intent;scheme=${APP_SCHEME};package=${APP_PACKAGE};` +
        `S.browser_fallback_url=${encodeURIComponent(fallbackPage)};end`;
      const isAndroid = /Android/i.test(navigator.userAgent || '');
      const appUrl = isAndroid ? androidIntentUrl : customSchemeUrl;
      const supportedLocales = new Set([
        'en', 'af', 'am', 'ar', 'be', 'bg', 'bn', 'bs', 'cs', 'da', 'de',
        'eo', 'es', 'et', 'fr', 'gl', 'gu', 'haw', 'he', 'hi', 'hr', 'hu',
        'is', 'it', 'ja', 'ka', 'kk', 'kn', 'ko', 'ku', 'la', 'lo', 'lt',
        'lv', 'nl', 'no', 'pl', 'pt', 'ro', 'ru', 'sl', 'sv', 'th', 'uk',
        'ur', 'vi', 'zh'
      ]);

      const requestedLanguage = (
        params.get('lang') ||
        new URL(location.href).searchParams.get('lang') ||
        navigator.language ||
        'en'
      ).toLowerCase().replace('_', '-');
      const locale = supportedLocales.has(requestedLanguage)
        ? requestedLanguage
        : (supportedLocales.has(requestedLanguage.split('-')[0])
          ? requestedLanguage.split('-')[0]
          : 'en');
      document.documentElement.lang = locale;

      const status = document.getElementById('status');
      const targetBox = document.getElementById('target');
      const openButton = document.getElementById('open');
      const externalButton = document.getElementById('external');
      const installButton = document.getElementById('install');
      const hint = document.getElementById('hint');
      let strings = {};
      let statusMode = 'opening';
      const tr = (key, fallback) => {
        const value = strings && typeof strings[key] === 'string'
          ? strings[key].trim()
          : '';
        return value || fallback;
      };
      const applyLanguage = () => {
        const appName = tr('app_name', 'Rusted Warfare Workshop');
        document.title = appName;
        document.querySelector('h1').textContent = appName;
        status.textContent = statusMode === 'opening'
          ? tr('open_shared_entry', 'Opening shared entry…')
          : tr('try_again', 'If it did not open automatically, try again.');
        openButton.textContent = `${tr('open_with', 'Open with…')} ${appName}`;
        externalButton.textContent = `${tr('open_externally', 'Open externally')}: Steam Workshop`;
        installButton.textContent = tr('open_install_page', 'Open install page');
        hint.textContent = `${tr('open_with', 'Open with…')} ${appName}. ` +
          `${tr('open_externally', 'Open externally')}: Steam Workshop.`;
      };
      const loadLanguage = async () => {
        try {
          const response = await fetch(
            `./assets/app_native/strings/json/${encodeURIComponent(locale)}.json`,
            { cache: 'force-cache' }
          );
          if (response.ok) strings = await response.json();
        } catch (_) {}
        applyLanguage();
      };

      targetBox.textContent = target;
      openButton.href = appUrl;
      externalButton.href = target;
      installButton.href = INSTALL_URL;
      applyLanguage();
      void loadLanguage();

      const attemptOpen = () => {
        try { location.href = appUrl; } catch (_) {}
      };
      openButton.addEventListener('click', (event) => {
        event.preventDefault();
        statusMode = 'opening';
        applyLanguage();
        attemptOpen();
      });

      let alreadyAttempted = false;
      try {
        const key = `rw-open:${deepLinkQuery}`;
        alreadyAttempted = sessionStorage.getItem(key) === '1';
        if (!alreadyAttempted) sessionStorage.setItem(key, '1');
      } catch (_) {}

      if (!alreadyAttempted && !new URL(location.href).searchParams.has('fallback')) {
        window.setTimeout(attemptOpen, 350);
      }
      window.setTimeout(() => {
        if (document.visibilityState === 'visible') {
          statusMode = 'retry';
          applyLanguage();
        }
      }, 1500);
    })();
  </script>
</body>
</html>
